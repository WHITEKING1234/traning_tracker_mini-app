<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050507" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Training OS" />
    <title>Training OS</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Training OS</p>
          <h1 id="screen-title">Сегодня</h1>
        </div>
        <div class="profile-pill" id="profile-pill">TG</div>
      </header>

      <main id="app" class="app-main" aria-live="polite">
        <section class="loading-state">
          <div class="pulse-ring"></div>
          <p>Загружаю тренировку</p>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Основная навигация">
        <button class="nav-button is-active" type="button" data-tab="home" aria-label="Сегодня">
          <span class="nav-icon">⌁</span>
          <span>Сегодня</span>
        </button>
        <button class="nav-button" type="button" data-tab="workout" aria-label="Тренировка">
          <span class="nav-icon">▦</span>
          <span>Тренировка</span>
        </button>
        <button class="nav-button" type="button" data-tab="progress" aria-label="Прогресс">
          <span class="nav-icon">↗</span>
          <span>Прогресс</span>
        </button>
        <button class="nav-button" type="button" data-tab="settings" aria-label="Настройки">
          <span class="nav-icon">⚙</span>
          <span>Настройки</span>
        </button>
      </nav>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
